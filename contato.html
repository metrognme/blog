    <main>
        <h1>Contato</h1>
        <!-- Troque "seu-id" pelo ID real do seu formulário no Formspree. -->
        <form action="https://formspree.io/f/seu-id" method="POST">
            <p>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
            </p>
            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
            </p>
            <p>
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem..."></textarea>
            </p>
            <button type="submit">Enviar Mensagem</button>
        </form>

        <address>
            <p>Christopher Luduvico | Goiânia - GO</p>
            <p>Contato via e-mail ou redes profissionais.</p>
        </address>
    </main>
